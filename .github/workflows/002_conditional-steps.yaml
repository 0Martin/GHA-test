name: 02 Conditional steps

on:
  workflow_dispatch:

jobs:
  example_job:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - exit code 0
        id: successful_step
        run: |
          echo "exit code 0"
          exit 0
        shell: bash

      - name: Step 2 - Execute if previous succeeded
        if: ${{ success() }}
        run: |
          echo "Running becasue the previous step has succeeded"

      - name: Step 3 - I am falling
        run: |
          echo "Running becasue the previous step has succeeded"
          exit 1

      - name: Step 4 - I will never execute
        run: |
          echo "I will never execute"

      - name: Step 5 - Execute on workflow failure
        if: ${{ failure() }}
        run: |
          echo "Workflow failed"